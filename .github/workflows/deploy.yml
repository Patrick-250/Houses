name: Deploy MERN App

on:
  push:
    branches:
      - main
      - Development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to Development Server
        if: github.ref == 'refs/heads/Development'
        env:
          SSH_PASSWORD: ${{ secrets.DEV_SERVER_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no ${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_IP }} << 'EOF'
            cd C:/Users/Administrator/Desktop/Websites/HousesApp
            git pull origin Development
            npm install
            pm2 restart all
          EOF

      - name: Deploy to Production Server
        if: github.ref == 'refs/heads/main'
        env:
          SSH_PASSWORD: ${{ secrets.PROD_SERVER_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_IP }} << 'EOF'
            cd C:/Users/Administrator/Desktop/Websites/HousesApp
            git pull origin main
            npm install
            pm2 restart all
          EOF
