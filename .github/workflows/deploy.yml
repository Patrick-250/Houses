name: Houses App Deployment

on:
  push:
    branches:
      - main
      - Development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH for Development
        if: github.ref == 'refs/heads/Development'
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SERVER_SSH_KEY }}

      - name: Set up SSH for Production
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.PROD_SERVER_SSH_KEY }}

      - name: Deploy to Development Server
        if: github.ref == 'refs/heads/Development'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_IP }} << 'EOF'
            cd C:/Users/Administrator/Desktop/Websites/HousesApp
            git pull origin Development
            npm install
            pm2 restart all
          EOF

      - name: Deploy to Production Server
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_IP }} << 'EOF'
            cd C:/Users/Administrator/Desktop/Websites/HousesApp
            git pull origin main
            npm install
            pm2 restart all
          EOF
